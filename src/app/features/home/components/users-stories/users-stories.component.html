<div data-aos="slide-left" data-aos="slide-left" data-aos-duration="2500" data-aos-easing="ease" data-aos-once="false"
    class="container">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="section-title text-center mb-4 pb-2">
                <h4 class="title mb-4">ماذا قالو عن إياس</h4>
                <p class="text-muted para-desc mx-auto mb-0"><span
                        class="text-primary fw-bold">إياس</span> المنصة الافضل للاستشارة القانونية بشهادة المستخدمين</p>
            </div>
        </div>
        <!--end col-->
    </div>
    <!--end row-->

    <owl-carousel-o id="customer-testi" [options]="customOptions">
        <ng-container *ngFor="let data of testimonialData">
            <ng-template carouselSlide>
                <div class="tiny-slide">
                    <div class="d-flex client-testi m-1">
                        <img src="{{data.profile}}" class="avatar avatar-small client-image rounded shadow" alt="">
                        <div class="card flex-1 content p-3 shadow rounded position-relative">
                            <ul class="list-unstyled mb-0">
                                <li class="list-inline-item"><i class="mdi mdi-star text-warning"></i></li>
                                <li class="list-inline-item"><i class="mdi mdi-star text-warning"></i></li>
                                <li class="list-inline-item"><i class="mdi mdi-star text-warning"></i></li>
                                <li class="list-inline-item"><i class="mdi mdi-star text-warning"></i></li>
                                <li class="list-inline-item"><i class="mdi mdi-star text-warning"></i></li>
                            </ul>
                            <p class="text-muted mt-2">{{data.message}}</p>
                            <h6 class="text-primary">- {{data.name}} <small
                                    class="text-muted">{{data.designation}}</small>
                            </h6>
                        </div>
                    </div>
                </div>
            </ng-template>
        </ng-container>
    </owl-carousel-o>
</div>
