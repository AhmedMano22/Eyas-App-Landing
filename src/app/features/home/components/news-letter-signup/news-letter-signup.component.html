<section class="mb-5">
    <div class="container mt-100 mt-60">
        <div class="row justify-content-center">
            <div class="col-12 text-center">
                <div class="section-title mb-4 pb-2">
                    <h4 class="title mb-4">سجل اهتمامك لتعيش معنا كل جديد!</h4>
                    <p class="text-muted para-desc mx-auto mb-0">اكتب بريدك الإلكتروني وسنوافيك بالأخبار والعروض
                        الخاصة<span class="text-primary fw-bold"></span> </p>
                </div>
            </div>
            <!--end col-->
        </div>
        <!--end row-->

        <form [formGroup]="form" (ngSubmit)="onSubmitNewsLetter()">
            <div class="row justify-content-center mt-2">
                <div class="d-flex justify-content-center m-1">

                    <ngx-recaptcha2 #captchaElem siteKey="6LfBeZAlAAAAAMr2Wdf_h9G2T0txY51hhPSFEY9D" [size]="size"
                        [hl]="lang" [theme]="theme" [type]="type" formControlName="recaptcha">
                    </ngx-recaptcha2>
                </div>
                <div class="col-lg-7 col-md-10">
                    <div class="text-center subcribe-form">
                        <input formControlName="email" type="email" class="form-control rounded-pill shadow"
                            placeholder="بريدك الإلكتروني" required aria-describedby="newssubscribebtn">
                        <button type="submit" [disabled]="this.form.invalid" class="btn btn-pills btn-eyas-dark"
                            id="newssubscribebtn">اشترك</button>
                        <!--end form-->
                    </div>
                </div>
                <!--end col-->
            </div>
        </form>
        <!--end row-->
    </div>
    <!--end container-->
</section>
<!--end section-->
<!-- Testi Subscribe End -->
